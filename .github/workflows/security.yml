name: Security Audit

on:
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Run Solidity security linting
        run: npm run lint:sol

      - name: Run custom security audit
        run: npm run security:audit

      - name: Check for secrets in code
        run: |
          if grep -r -i "private.*key.*=\|secret.*=\|password.*=" contracts/ scripts/ --exclude-dir=node_modules; then
            echo "❌ Found potential secrets in code!"
            exit 1
          fi
          echo "✅ No secrets found in code"

  gas-analysis:
    name: Gas Optimization Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Analyze contract sizes
        run: npm run gas:analyze

      - name: Run gas benchmarks
        run: npm run test:gas

      - name: Generate gas report
        run: npm run gas:report

  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  code-scanning:
    name: Code Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security scan
        run: npm run lint:js
        continue-on-error: true

      - name: Check for common vulnerabilities
        run: |
          echo "Checking for common vulnerability patterns..."

          # Check for unsafe external calls
          if grep -r "call{value:" contracts/ --exclude-dir=node_modules; then
            echo "⚠️  Found external calls with value - ensure proper checks"
          fi

          # Check for delegatecall usage
          if grep -r "delegatecall" contracts/ --exclude-dir=node_modules; then
            echo "⚠️  Found delegatecall - ensure safe usage"
          fi

          # Check for selfdestruct
          if grep -r "selfdestruct" contracts/ --exclude-dir=node_modules; then
            echo "❌ Found selfdestruct - highly dangerous!"
            exit 1
          fi

          echo "✅ Basic vulnerability checks passed"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, gas-analysis, code-scanning]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gas Analysis: ${{ needs.gas-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Scanning: ${{ needs.code-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.security-audit.result }}" == "success" ]] && \
             [[ "${{ needs.gas-analysis.result }}" == "success" ]] && \
             [[ "${{ needs.code-scanning.result }}" == "success" ]]; then
            echo "✅ All security checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some security checks failed!" >> $GITHUB_STEP_SUMMARY
          fi
